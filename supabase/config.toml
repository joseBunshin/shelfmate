# Supabase local-development configuration.
# See https://supabase.com/docs/guides/local-development/cli/config for full reference.
# U1.3 will populate this with project_id after `supabase link --project-ref <ref>`
# against the production Supabase project (created in U1.2 in us-east-1).

project_id = "shelfmate-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false  # local dev only; production enables confirmations

# Apple + Google providers wired in U1.3 against secrets uploaded in U1.2.
# [auth.external.apple]
# enabled = true
# client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
#
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false
