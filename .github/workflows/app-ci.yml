name: app CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

# Per AGENTS.md secrets policy: secrets are environment-scoped and not
# accessible to workflow runs from forked-repo PRs.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings

      - name: Format check
        run: dart format --output none --set-exit-if-changed lib test

      - name: Unit + widget tests
        run: flutter test
